<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POV Display</title>
<style>
    body { font-family: sans-serif; background: #222; color: #eee; padding: 16px; }
    canvas { image-rendering: pixelated; border: 1px solid #555; background: #000; max-width: 100%; height: auto; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
    .col { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; }
    h3 { margin: 0 0 4px; font-size: 14px; font-weight: normal; color: #aaa; }
    .controls { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    .controls label { display: flex; align-items: center; gap: 8px; }
    #statusBar { font-size: 13px; color: #aaa; margin-bottom: 16px; }
    #statusBar.offline { color: #f66; }
</style>
</head>
<body>

<div id="statusBar">-</div>

<div class="controls">
    <input type="file" id="fileInput" accept="image/*">
    <label>Fit mode:
        <select id="fitModeInput">
            <option value="fit" selected>Fit (show whole image)</option>
            <option value="crop">Crop (fill circle, may cut edges)</option>
        </select>
    </label>
    <label>Background colour: <input type="color" id="bgColorInput" value="#000000"></label>
    <label>Antialiasing: <input type="range" id="aaInput" min="1" max="5" step="1" style="width: 120px;"> <span id="aaVal"></span></label>
    <button id="sendBtn" disabled>Send to display</button>
    <span id="statusEl"></span>
</div>

<p><a href="/calibrate">Calibration settings</a></p>

<div class="row">
    <div class="col">
        <h3>Source (crop circle shown)</h3>
        <canvas id="sourceCanvas" width="400" height="400"></canvas>
    </div>
    <div class="col">
        <h3>Reconstructed</h3>
        <canvas id="reconCanvas" width="400" height="400"></canvas>
    </div>
</div>

<script src="/gif.js"></script>
<script>
const NUM_COLUMNS = 298;   // angular samples per rev
const LEDS_PER_WING = 48;  // radial samples

const ROTATION_OFFSET_DEG = -90; // determined by trial
const ROTATION_OFFSET_RAD = ROTATION_OFFSET_DEG * Math.PI / 180;

// NxN sub-samples averaged per polar cell for antialiasing - resets to this default on reload
const AA_DEFAULT = 3;
let SUPERSAMPLE = AA_DEFAULT;

const MAX_ANIMATION_FRAMES = 300; // matches the RP2350's flash region
const PREVIEW_MS = 100; // source preview playback rate - unrelated to the real on-device speed (set by revs per frame on the calibration page)

const fileInput = document.getElementById('fileInput');
const fitModeInput = document.getElementById('fitModeInput');
const bgColorInput = document.getElementById('bgColorInput');
const aaInput = document.getElementById('aaInput');
const aaVal = document.getElementById('aaVal');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('statusEl');
const sourceCanvas = document.getElementById('sourceCanvas');
const reconCanvas = document.getElementById('reconCanvas');

aaInput.value = AA_DEFAULT;
aaVal.textContent = `${AA_DEFAULT}x${AA_DEFAULT}`;

// Reprocess antialising live on drag
aaInput.addEventListener('input', () => {
    SUPERSAMPLE = parseInt(aaInput.value, 10);
    aaVal.textContent = SUPERSAMPLE == 1 ? 'off' : `${SUPERSAMPLE}x${SUPERSAMPLE}`;
    if (sources.length) processImage(sources[0]); // reprocess if there is at least one frame
});

let sources = []; // decoded images - one per GIF frame, or one for a still, so settings changes can re-run without reloading the file
let previewTimer = null;
let previewIndex = 0;

// On file input, decode and process
fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;

    stopPreview();
    for (const src of sources) src.close?.(); // decoded GIF frames hold their pixels until closed
    sources = [];
    sendBtn.disabled = true;
    statusEl.textContent = 'decoding...';

    try {
        sources = await decodeFile(file);
    } catch (err) {
        sources = [];
        statusEl.textContent = `decode failed: ${err.message}`;
        return;
    }
    processImage(sources[0]);
    if (sources.length > 1) startPreview();
});

// Cycles the source canvas through every frame so you can preview animation
// the reconstruction canvas is left showing frame 0 as sampling is too slow to be done live
function startPreview() {
    previewIndex = 0;
    previewTimer = setInterval(() => {
        previewIndex = (previewIndex + 1) % sources.length;
        drawSource(sources[previewIndex]);
        drawCropCircle();
    }, PREVIEW_MS);
}

function stopPreview() {
    clearInterval(previewTimer);
    previewTimer = null;
}

// Reprocess reconstructed preview on fit/bg changes
fitModeInput.addEventListener('change', () => { if (sources.length) processImage(sources[0]); });
bgColorInput.addEventListener('input', () => { if (sources.length) processImage(sources[0]); });

// Decodes file into a list of images
// One per frame if a GIF, one for a still
async function decodeFile(file) {
    if (file.type !== 'image/gif') {
        const img = new Image();
        await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => reject(new Error('could not load image'));
            img.src = URL.createObjectURL(file);
        });
        return [img];
    }

    const reader = new GifReader(new Uint8Array(await file.arrayBuffer()));
    const composited = compositeGifFrames(reader);
    if (composited.length > MAX_ANIMATION_FRAMES) {
        throw new Error(`GIF has ${composited.length} frames, max is ${MAX_ANIMATION_FRAMES}`);
    }

    const out = [];
    for (const frame of composited) out.push(await createImageBitmap(frame));
    return out;
}

// Decodes every GIF frame with omggif and composites them into full-screen images, applying each frame's disposal method
function compositeGifFrames(reader) {
    const width = reader.width, height = reader.height;
    const pixels = new Uint8ClampedArray(width * height * 4);

    const out = [];
    for (let i = 0; i < reader.numFrames(); i++) {
        const info = reader.frameInfo(i);

        // "Restore to previous" disposal needs a snapshot from before this frame is drawn
        const preSnapshot = info.disposal === 3 ? pixels.slice() : null;

        reader.decodeAndBlitFrameRGBA(i, pixels);
        out.push(new ImageData(pixels.slice(), width, height));

        if (info.disposal === 2) { // restore to background - clear this frame's sub-rect to transparent
            for (let row = info.y; row < info.y + info.height; row++) {
                pixels.fill(0, (row * width + info.x) * 4, (row * width + info.x + info.width) * 4);
            }
        } else if (info.disposal === 3) {
            pixels.set(preSnapshot);
        }
        // disposal 0 or 1 ("do not dispose"): leave pixels as-is for the next frame
    }
    return out;
}

// Send POST frame/animation when send button clicked
sendBtn.addEventListener('click', async () => {
    if (!sources.length) return;

    // Everything is stored in flash as an animation - a still is just a one frame one
    statusEl.textContent = `sending ${sources.length} frame${sources.length > 1 ? 's' : ''} - the display blanks while flash is written, this takes a while...`;

    const sampled = sources.map(sampleImage);
    const body = new Uint8Array(sampled.length * sampled[0].length);
    sampled.forEach((frame, i) => body.set(frame, i * frame.length));

    try {
        const res = await fetch('/animation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body,
        });
        statusEl.textContent = res.ok ? 'sent!' : `error: ${res.status} ${await res.text()}`;
    } catch (err) {
        statusEl.textContent = `failed: ${err.message}`;
    }
});

// Draws one source into the source canvas, scaled and centred. No crop circle - it
// would be sampled into the frame
function drawSource(img) {
    const srcCtx = sourceCanvas.getContext('2d');
    const size = sourceCanvas.width;

    // Fill with the chosen background colour first - shows through transparency
    srcCtx.fillStyle = bgColorInput.value;
    srcCtx.fillRect(0, 0, size, size);

    let scale;
    if (fitModeInput.value === 'crop') {
        // Scale until image fits whole square, so some of original image cropped outside circle
        scale = size / Math.min(img.width, img.height);
    } else {
        // Fit inside the circle
        // Shrink so images diagonal = circle's diameter
        scale = size / Math.sqrt(img.width ** 2 + img.height ** 2);
    }
    // Render source image
    const dw = img.width * scale;
    const dh = img.height * scale;
    srcCtx.drawImage(img, (size - dw) / 2, (size - dh) / 2, dw, dh);
}

function drawCropCircle() {
    const srcCtx = sourceCanvas.getContext('2d');
    const size = sourceCanvas.width;
    srcCtx.strokeStyle = '#0f0';
    srcCtx.beginPath();
    srcCtx.arc(size / 2, size / 2, size / 2, 0, 2 * Math.PI);
    srcCtx.stroke();
}

// Draws and samples one source into a polar frame
function sampleImage(img) {
    const size = sourceCanvas.width;
    drawSource(img);
    const pixels = sourceCanvas.getContext('2d').getImageData(0, 0, size, size);
    return sampleToPolarFrame(pixels, size, ROTATION_OFFSET_RAD);
}

function processImage(img) {
    const frame = sampleImage(img);
    drawCropCircle();
    drawReconstruction(frame, sourceCanvas.width, ROTATION_OFFSET_RAD);

    sendBtn.disabled = false;
    statusEl.textContent = '';
}

/*
For every (column, radius) pair, map back to an (x, y) in the source image
and read its colour. Centre of the source square = polar origin
its inscribed circle (radius = size/2) = the display's outer edge.
Each (column, radius) cell is antialiased by averaging an NxN grid
*/
function sampleToPolarFrame(pixels, size, rotationRad) {
    const frame = new Uint8ClampedArray(NUM_COLUMNS * LEDS_PER_WING * 3);
    const cx = size / 2; // centre coords
    const cy = size / 2;
    const maxRadiusPx = size / 2;
    const angleStep = (2 * Math.PI) / NUM_COLUMNS; // angular width of one column
    const radiusStep = maxRadiusPx / LEDS_PER_WING; // radial width of one LED step

    // Loop through columns and radius and match each (c,r) pixel to (x,y) in image
    for (let c = 0; c < NUM_COLUMNS; c++) {
        const baseAngle = (c / NUM_COLUMNS) * 2 * Math.PI + rotationRad;

        for (let r = 0; r < LEDS_PER_WING; r++) {
            // LED r sits at the centre of its own radial step
            const baseRadius = (r + 0.5) * radiusStep;

            // Averaging sub-samples
            let rSum = 0, gSum = 0, bSum = 0;
            for (let sa = 0; sa < SUPERSAMPLE; sa++) {
                // Sub-sample offsets spread evenly across the cell, centred on 0
                const angleOffset = SUPERSAMPLE === 1 ? 0 : (sa / (SUPERSAMPLE - 1) - 0.5) * angleStep; // Gives [-0.5,0.5] * angleStep. Default to 0 to avoid div by 0 if 1x1
                const angle = baseAngle + angleOffset;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                for (let sr = 0; sr < SUPERSAMPLE; sr++) {
                    const radiusOffset = SUPERSAMPLE === 1 ? 0 : (sr / (SUPERSAMPLE - 1) - 0.5) * radiusStep;
                    const radiusPx = Math.max(0, baseRadius + radiusOffset); // Prevent negative radius

                    const x = Math.round(cx + radiusPx * cos); // map angle,radius polar coords where polar origin is centre of square to x,y coords
                    const y = Math.round(cy - radiusPx * sin); // y mirrored to match spin direction
                    // Clamp to canvas bounds so cells near the edge don't read outside the pixel array
                    const xc = Math.min(size - 1, Math.max(0, x));
                    const yc = Math.min(size - 1, Math.max(0, y));

                    // Calculate index into flat 1D byte array of source
                    const srcIdx = (yc * size + xc) * 4; // skip y rows then x into row, note each pixel is 4 bytes as RGBA
                    // Add sums of subsamples for averaging
                    rSum += pixels.data[srcIdx];
                    gSum += pixels.data[srcIdx + 1];
                    bSum += pixels.data[srcIdx + 2];
                }
            }

            const sampleCount = SUPERSAMPLE * SUPERSAMPLE;
            // Calculate index into flat 1D byte array for destination
            const dstIdx = (c * LEDS_PER_WING + r) * 3; // skip c columns then r into column, note each pixel is 3 bytes as RGB

            // Calculate averages and set in frame
            frame[dstIdx]     = rSum / sampleCount;
            frame[dstIdx + 1] = gSum / sampleCount;
            frame[dstIdx + 2] = bSum / sampleCount;
        }
    }
    return frame;
}

// Inverse of sampleToPolarFrame - for each output pixel (x,y), find its (column, radius) and look up the colour
function drawReconstruction(frame, size, rotationRad) {
    // Setup blank image
    const ctx = reconCanvas.getContext('2d');
    const imgData = ctx.createImageData(size, size);
    const cx = size / 2;
    const cy = size / 2;
    const maxRadiusPx = size / 2;

    // Loop through (x,y) pixels and find corresponding (c,r) pixel
    for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
            const dx = x - cx; // relative to centre
            const dy = y - cy;
            const radiusPx = Math.sqrt(dx ** 2 + dy ** 2); // distance from centre to pixel
            const dstIdx = (y * size + x) * 4;

            if (radiusPx > maxRadiusPx) {
                imgData.data[dstIdx + 3] = 255; // outside display - leave black
                continue;
            }

            // Map to angle
            let angle = Math.atan2(-dy, dx) - rotationRad; // Note we invert the y mirror and angle offset
            angle = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI); // Ensure between 0 and 2pi

            // Map angle and radius to column and led
            const c = Math.round((angle / (2 * Math.PI)) * NUM_COLUMNS) % NUM_COLUMNS;
            const r = Math.min(LEDS_PER_WING - 1, Math.floor((radiusPx / maxRadiusPx) * LEDS_PER_WING)); // Clamp to max radius

            // Copy rgb from frame to preview image
            const srcIdx = (c * LEDS_PER_WING + r) * 3;
            imgData.data[dstIdx]     = frame[srcIdx];
            imgData.data[dstIdx + 1] = frame[srcIdx + 1];
            imgData.data[dstIdx + 2] = frame[srcIdx + 2];
            imgData.data[dstIdx + 3] = 255;
        }
    }
    ctx.putImageData(imgData, 0, 0);
}
</script>
<script src="/status.js"></script>
</body>
</html>
